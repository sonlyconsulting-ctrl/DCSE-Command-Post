  rule: "This manifest points to authority. It does not create, restate, or supersede authority."

zones:
  authority:
    path:
      - "governance/v7.2/*.md"
      - "governance/v7.2/*.json"
      - "governance/v7.2/source/**"
      - "governance/v7.2/source/doctrines/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md"
      - "governance/v7.2/source/doctrines/*.md"
    effect: "operative v7.2 authority, promoted v7.2 doctrine, registered directives, and routed doctrine projections"
  source:
    path:
      - "governance/v7.2/source/**"
    effect: "historical lineage and adopted subject content; source lifecycle does not independently override operative v7.2 authority"
  execution:
    path:
      - "governance/v7.2/implementations/**"
      - "governance/v7.2/project-instructions/**"
    effect: "bounded instructions, contracts, plans, ledgers, corrections, and activity records"
  evidence:
    path:
      - "tribunal/v7/**"
    effect: "audits, receipts, scripts, logs, snapshots, and proof of events"
  invariant: "Execution and evidence files may not declare constitutional authority; authority must resolve through the operative controller or registered/promoted DCS directive."

startup_sequence:
  - verify_repository
  - verify_main_authority_branch
  - load_r5_operative_designation
  - load_v7_2_master_profile
  - load_v7_2_governance_sync
  - load_v7_2_doctrine_index
  - load_express_dcs_directive_registry
  - load_task_traceability_and_navigable_closeout_directive
  - load_completion_evidence_collector_directive
  - verify_source_authority_through_d22_v7_2
  - classify_lane_entity_and_task
  - establish_task_id
  - produce_preflight_validation
  - route_doctrines_through_d21
  - verify_github_access_when_required
  - verify_supabase_access_when_required
  - load_assignment
  - produce_startup_acknowledgment
  - begin_bounded_work
  - maintain_doctrine_consideration_log
  - run_closure_integrity_validation
  - collect_completion_evidence
  - produce_navigable_closeout
  - evaluate_goal_status_and_next_work
  - validate_and_closeout

runtime_task_contract:
  applies_to: "every substantive task"
  required_before_execution:
    - task_id
    - lane
    - entity
    - task_type
    - destination
    - requested_action
    - artifact_type
    - confidentiality
    - authority_holder
    - authority_source
    - executing_model_or_agent
    - access_level
    - systems_involved
    - secret_exposure
    - ps_exposure
    - approval_requirement
    - rollback_or_recovery_requirement
    - expected_deliverables
    - exit_criteria
  visible_preflight_required: true
  doctrine_consideration_log_required: true
  closure_integrity_validation_required: true
  completion_evidence_packet_required: true
  navigable_closeout_required: true
  required_before_closeout:
    - original_requested_outcome
    - actual_completed_outcome
    - what_changed
    - goal_status
    - goal_shift_reasoning_when_material
    - final_task_state
    - deliverable_inventory
    - direct_human_review_links_when_available
    - github_artifact_commit_pr_issue_refs_when_available
    - supabase_registry_or_runtime_refs_when_available
    - tribunal_receipt_or_evidence_refs_when_available
    - command_post_or_escd_refs_when_available
    - deployment_or_preview_refs_when_available
    - related_doctrine_refs_when_available
    - rollback_or_history_refs_when_available
    - commit_deployment_version_or_runtime_identifiers_as_applicable
    - material_sha256_when_required_and_verified
    - validation_results
    - dependent_artifact_reconciliation
    - unresolved_findings
    - recommended_next_body_of_work_when_meaningful
    - required_human_decision_if_any
  next_work_controls:
    - CONTINUE
    - SKIP
    - DEFER
    - REORDER
    - INTERRUPT
  complete_claim_rule: "A substantive task may not be reported COMPLETE until the claimed final state backward-chains to direct evidence and affected dependent artifacts are reconciled or explicitly disclosed as unresolved."
  handoff_task_identity_rule: "Preserve the originating task ID; child tasks must record parent task ID and preserve authority and source lineage."
  goal_shift_rule: "A governing goal may not be silently reinterpreted; material goal shifts must be explicit, attributable, and carried into subsequent intake."
  noncompliance_state: "BLOCKED_OR_PARTIAL_NOT_V7_2_COMPLIANT"

model_harmony:
  authority_chain_required: true
  common_chain:
    - r5_operative_designation
    - v7_2_master_profile
    - v7_2_governance_sync
    - v7_2_doctrine_index
    - express_dcs_directive_registry
    - d22_v7_2_source_reconciliation
    - d21_task_routing
    - task_traceability_and_navigable_closeout
    - completion_evidence_collector
    - universal_onboarding_and_access
    - task_routed_doctrines
  self_assigned_authority: "PROHIBITED"
  summary_as_authority: "PROHIBITED"
  missing_chain_state: "UNSYNCHRONIZED_OR_DEGRADED"
  compliance_claim_when_unsynchronized: "PROHIBITED"

ps_publication_firewall:
  status: "ACTIVE_AS_PRESERVED_BY_DCS-DIR-20260910-001"
  concluded_matter_blanket_internal_isolation: "RETIRED"
  internal_private_use: "PERMITTED_SUBJECT_TO_CONFIDENTIALITY_PURPOSE_AND_ACCESS_CONTROLS"
  public_spill_default: "PROHIBITED_WITHOUT_EXPRESS_DCS_AUTHORIZATION"
  public_facing_destinations:
    - Sonly_Consulting
    - Smoove_Spots
    - The_Initiative
    - websites
    - public_web_apps
    - campaigns
    - social_media
    - marketing
    - advertising
    - investor_materials
    - movement_narratives
    - public_product_copy
    - external_communications
  future_legal_matter_rule: "DCS may activate a stricter matter-specific protected firewall."

workflow_lifecycle:
  review_selection: "capability-based and attributable"
  validation_accountability:
    reviewer_agent_id_required: true
    anonymous_or_null_reviewer: "PROHIBITED"
    validation_scope_disclosure_required: true
    evidence_not_reperformed_must_be_disclosed: true
  self_review_rule: "The executor may verify completeness but may not be the sole promotion validator."
  evidence_acceptance:
    accepted: "record result and advance only within approved scope"
    accepted_with_findings: "record result, create remediation tasks, and apply controlling gate"
    rejected_or_insufficient: "correct within approved scope, then revalidate"
  audit_findings:
    block_when:
      - unresolved_critical_or_high_risk
      - credential_exposure_or_security_exception
      - destructive_action_outside_approved_procedure
      - production_or_public_release
      - material_architecture_replacement
      - irreconcilable_authoritative_evidence
    otherwise: "register remediation and continue within approved scope"

completion_evidence:
  authority: "DCS-DIR-20260906-002"
  directive_path: "governance/v7.2/DCSE_V7_2_COMPLETION_EVIDENCE_COLLECTOR_DIRECTIVE_20260906.md"
  human_review_packet_required: true
  cross_system_collection_required_when_applicable: true
  direct_links_preferred: true
  stale_dependent_state_blocks_complete_claim: true
  evidence_classes:
    - canonical_artifact
    - commit_or_version
    - material_checksum
    - runtime_registry
    - deployment_or_preview
    - tribunal_or_evidence_record
    - validation_result
    - unresolved_finding

navigable_closeout:
  authority: "DCS-DIR-20260910-001"
  directive_path: "governance/v7.2/DCSE_Runtime_Harmony_Task_Traceability_and_Navigable_Closeout_v7-2.md"
  goal_status_required: true
  next_work_recommendation_required_when_meaningful: true
  dcs_interrupt_control: true
  direct_navigation_preferred: true
  target_surfaces:
    - github
    - supabase
    - tribunal
    - command_post
    - escd
    - deployment
    - doctrine
    - rollback_history

credentials:
  github_pat_in_chat: "PROHIBITED"
  supabase_service_role_to_models: "PROHIBITED"
  approved_access:
    - github_mcp_oauth
    - authenticated_git
    - github_cli_oauth
    - supabase_mcp_oauth
    - dcse_control_plane

artifact_policy:
  essential_identity_required: true
  canonical_source_required: true
  checksum_required_when_material: true
  promotion_receipt_required_for_authority: true
  completion_evidence_packet_required_for_substantive_closeout: true
  reuse_before_redesign_required: true
  persistence_routing_authority: "governance/v7.2/source/doctrines/D22_Source_Authority_Runtime_Distribution_v7-2.md"

negative_finding_policy:
  scoped_only: true
  finding_does_not_equal_failure: true
  disposition: "record remediation and continue unless a reserved stop gate is triggered"

poller:
  role: "task transport and heartbeat, not source of truth"
  source_of_truth:
    - github_canonical_artifact
    - dcse_ddna_runtime_registry
  fallback: "manual authenticated agent session"
  health_monitor_required: true

promotion_gate:
  required:
    - exact_diff_dcs_level_0_approval
    - canonical_github_commit
    - content_sha256
    - runtime_registry_reconciliation
    - attributable_independent_validation
    - promotion_receipt
  controller_state: "OPERATIVE_R5"
  controller_designation_commit: "f72c3288f301d38dc8184d2bbd55c6ef17eae670"
  controller_sha256: "2d6afe04be2f65f8d56d6b4b26c81e254e04171e3c94a40023b56b9236de36ae"
  current_package_state: "OPERATIVE_R5_PLUS_PROMOTED_V7_2_GOVERNANCE_SYNC_AND_NAVIGABLE_CLOSEOUT"
