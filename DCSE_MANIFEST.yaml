dcse:
  governance_version: "V7.1"
  status: "ACTIVE_CONTROLLED_USE"
  principle: "Reason once. Automate thereafter."

canonical:
  github:
    repository: "sonlyconsulting-ctrl/DCSE-Command-Post"
    branch: "governance/v7.1-owned-product-harness"
    pull_request: 29
    governance_path: "governance/v7.1/"
  supabase:
    governance:
      name: "DCSE-DDNA"
      project_id: "uutpzaiqymyufljdgdaa"
    operations:
      name: "SC-Command-Post"
      project_id: "nevgdyfpxdaloacuutal"

startup_sequence:
  - load_manifest
  - resolve_lane_and_task
  - verify_repository
  - verify_branch
  - verify_github_access
  - verify_supabase_access
  - load_governance
  - load_assignment
  - produce_startup_acknowledgment
  - begin_work

authority:
  operational_authorized:
    - documentation_updates
    - artifact_registration
    - pull_request_creation
    - issue_creation
    - bounded_infrastructure_repair
    - replacement_staging_environment
    - approved_comparison_jobs
    - evidence_collection
    - routine_evidence_acceptance
    - routine_evidence_promotion
    - sequential_body_of_work_release
    - capability_based_reassignment
    - non_destructive_data_correction_with_rollback
  standing_conditional_authorization:
    enabled: true
    purpose: "Continue approved operational objectives until goal state without repeated approval stops."
    applies_when:
      - task_scope_is_already_approved
      - acceptance_evidence_is_complete
      - accountable_validator_is_recorded
      - no_reserved_stop_gate_is_triggered
    effect:
      - accept_completed_bounded_work
      - record_findings_as_remediation_tasks
      - promote_routine_evidence_only
      - release_the_next_dependent_body_of_work
      - reassign_when_a_named_model_is_unavailable
    does_not_waive:
      - attributable_validation
      - evidence
      - tests
      - rollback
      - lane_isolation
      - security_controls
  dcs_reserved:
    - constitutional_change
    - governance_framework_promotion
    - production_release
    - security_exception
    - lane_boundary_change
    - destructive_operation_outside_procedure
    - material_new_spending
  constitutional_change_control:
    exact_diff_dcs_approval_required: true
    agent_inference_from_general_operational_direction: "INSUFFICIENT"
    emergency_restriction_only: "An agent may propose or apply a narrower temporary safeguard, but may not expand its own authority."

workflow_lifecycle:
  review_selection: "capability-based and attributable, not bound to a preselected named model"
  named_model_unavailability: "automatic fallback to another attributable capable validator; never a standalone stop gate"
  validation_accountability:
    reviewer_agent_id_required: true
    anonymous_or_null_reviewer: "PROHIBITED"
    validation_scope_disclosure_required: true
    evidence_not_reperformed_must_be_disclosed: true
  self_review_rule: "The executor may verify completeness but may not be the sole promotion validator. Reassign automatically to another attributable validator. Direct DCS attestation may substitute when explicitly recorded."
  evidence_acceptance:
    accepted: "advance automatically after accountable validation"
    accepted_with_findings: "advance automatically after accountable validation and create remediation tasks"
    rejected_or_insufficient: "correct automatically within approved scope, then revalidate"
  sequential_release:
    enabled: true
    trigger: "predecessor acceptance recorded by an accountable validator"
    action: "promote routine predecessor evidence and start successor without another conversational approval"
  audit_findings:
    block_promotion_only_when:
      - unresolved_critical_or_high_risk
      - credential_exposure_or_security_exception
      - destructive_action_required_outside_approved_procedure
      - production_or_public_release
      - lane_conflict
      - material_architecture_replacement
      - irreconcilable_authoritative_evidence
    otherwise: "register remediation and continue"

credentials:
  github_pat_in_chat: "PROHIBITED"
  supabase_service_role_to_models: "PROHIBITED"
  approved_access:
    - github_mcp_oauth
    - authenticated_git
    - github_cli_oauth
    - supabase_mcp_oauth
    - dcse_control_plane

artifact_policy:
  essential_identity_required: true
  canonical_source_required: true
  checksum_required_when_material: true

negative_finding_policy:
  scoped_only: true
  finding_does_not_equal_failure: true
  disposition: "record remediation and continue unless a reserved stop gate is triggered"

poller:
  role: "task transport and heartbeat, not source of truth"
  availability_target: "24x7"
  source_of_truth:
    - github
    - supabase
  fallback: "manual authenticated agent session"
  health_monitor_required: true

strategic_direction:
  decision_authority: "DCS"
  coauthor_reviewers:
    - ChatGPT
    - Claude
  execution_candidates:
    - Coder
    - Claude Code
    - Codex
    - Qwen
    - DeepSeek
    - Gemini
    - Grok
    - MiniMax
    - Ollama
