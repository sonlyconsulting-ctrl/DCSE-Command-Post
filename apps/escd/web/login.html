<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ESCD Secure Access</title><style>:root{--bg:#0a192f;--panel:#10233f;--line:#28486f;--text:#f4efe5;--muted:#9bb0ca;--gold:#d4af37;--bad:#ffb4a9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh}.box{width:min(420px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}.brand{font-weight:800;color:var(--gold);letter-spacing:.08em;font-size:20px}.sub{color:var(--muted);font-size:12px;margin:6px 0 20px}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}input{width:100%;background:#0d1d35;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:11px}.btn{width:100%;margin-top:16px;border:1px solid var(--gold);background:var(--gold);color:#071427;border-radius:7px;padding:10px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.55}.err{min-height:20px;color:var(--bad);font-size:12px;margin-top:10px}</style></head><body><main class="box"><div class="brand">ESCD</div><div class="sub">Authorized operator access</div><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit" class="btn" type="submit">Sign in</button><div id="error" class="err" role="alert"></div></form></main><script>'use strict';if(sessionStorage.getItem('escd_access_token'))location.replace('/escd/app');document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('submit'),err=document.getElementById('error');b.disabled=true;err.textContent='';try{const r=await fetch('/api/mvp/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'sign_in_failed');sessionStorage.setItem('escd_access_token',d.session.access_token);location.replace('/escd/app')}catch(x){err.textContent=x.message}finally{b.disabled=false}});</script></body></html>
