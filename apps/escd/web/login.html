<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESCD Secure Access</title>
<style>
:root{--bg:#0a192f;--panel:#10233f;--line:#28486f;--text:#f4efe5;--muted:#9bb0ca;--gold:#d4af37;--bad:#ffb4a9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{width:min(420px,calc(100% - 28px));background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px}
.brand{font-weight:800;color:var(--gold);letter-spacing:.08em;font-size:20px}
.sub{color:var(--muted);font-size:12px;margin:6px 0 18px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}
input{width:100%;background:#0d1d35;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:11px}
.btn{width:100%;margin-top:14px;border:1px solid var(--gold);background:var(--gold);color:#071427;border-radius:7px;padding:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-google{background:#ffffff;color:#1f2937;border:1px solid #d1d5db;margin-top:0}
.btn-google:hover{background:#f9fafb}
.divider{display:flex;align-items:center;margin:18px 0 10px;color:var(--muted);font-size:11px}
.divider-line{flex:1;height:1px;background:var(--line)}
.divider-text{padding:0 10px;text-transform:uppercase;letter-spacing:.05em}
.err{min-height:20px;color:var(--bad);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<main class="box">
<div class="brand">ESCD</div>
<div class="sub">Authorized operator access</div>

<button id="googleBtn" type="button" class="btn btn-google">
<svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
Sign in with Google
</button>

<div class="divider">
<div class="divider-line"></div>
<span class="divider-text">or sign in with email</span>
<div class="divider-line"></div>
</div>

<form id="login">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="submit" class="btn" type="submit">Sign in</button>
<div id="error" class="err" role="alert"></div>
</form>
</main>

<script>
'use strict';
if (location.hash && location.hash.includes('access_token=')) {
  try {
    const params = new URLSearchParams(location.hash.replace(/^#/, ''));
    const at = params.get('access_token'), rt = params.get('refresh_token');
    if (at) sessionStorage.setItem('escd_access_token', at);
    if (rt) sessionStorage.setItem('escd_refresh_token', rt);
    if (at) location.replace('/escd/app');
  } catch (_) {}
}
if (sessionStorage.getItem('escd_access_token')) {
  location.replace('/escd/app');
}

const googleBtn = document.getElementById('googleBtn');
if (googleBtn) {
  googleBtn.onclick = () => {
    const redirect = encodeURIComponent(window.location.origin + '/escd/app');
    window.location.href = 'https://nevgdyfpxdaloacuutal.supabase.co/auth/v1/authorize?provider=google&redirect_to=' + redirect;
  };
}

document.getElementById('login').addEventListener('submit', async e => {
  e.preventDefault();
  const b = document.getElementById('submit'), err = document.getElementById('error');
  b.disabled = true;
  err.textContent = '';
  try {
    const r = await fetch('/api/mvp/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      })
    });
    const d = await r.json();
    if (!r.ok) {
      throw new Error(d.error || 'sign_in_failed');
    }
    sessionStorage.setItem('escd_access_token', d.session.access_token);
    if (d.session.refresh_token) sessionStorage.setItem('escd_refresh_token', d.session.refresh_token);
    location.replace('/escd/app');
  } catch (x) {
    err.textContent = x.message;
  } finally {
    b.disabled = false;
  }
});
</script>
</body>
</html>
