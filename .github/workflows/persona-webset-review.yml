name: Persona Web Set Human Review Artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Persona Web Set QA
        run: |
          python -m unittest tests/test_persona_webset.py -v

      - name: Upload Persona Web Set Review Bundle
        uses: actions/upload-artifact@v4
        with:
          name: persona-webset-preview-bundle
          path: |
            personas/previews/persona_webset_preview_bundle.zip
            personas/previews/PREVIEW_MANIFEST.json
            personas/previews/review_index.html
          retention-days: 30
