name: DCSE Supabase Security Gate

on:
  pull_request:
    branches: [main, integration, staging]
    paths:
      - "supabase/**/*.sql"
      - "scripts/ci/validate_supabase_security.py"
      - ".github/workflows/dcse-supabase-security-gate.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**/*.sql"
      - "scripts/ci/validate_supabase_security.py"
      - ".github/workflows/dcse-supabase-security-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  anti-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve changed migrations
        id: changed
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="HEAD^"; fi
          git diff --diff-filter=ACMR --name-only "$base" HEAD -- 'supabase/**/*.sql' > /tmp/dcse-sql-files.txt
          sed 's/^/file: /' /tmp/dcse-sql-files.txt

      - name: Static migration security gate
        shell: bash
        run: |
          mapfile -t files < /tmp/dcse-sql-files.txt
          python3 scripts/ci/validate_supabase_security.py "${files[@]}"

      - name: Compile validator
        run: python3 -m py_compile scripts/ci/validate_supabase_security.py

  local-database-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Detect local Supabase configuration
        id: local
        shell: bash
        run: |
          if [ -f supabase/config.toml ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Local Supabase proof enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Local Supabase proof not applicable: supabase/config.toml is absent."
          fi

      - name: Start pinned local Supabase
        if: steps.local.outputs.enabled == 'true'
        run: npx --yes supabase@2.81.3 start

      - name: Reset and apply migrations
        if: steps.local.outputs.enabled == 'true'
        run: npx --yes supabase@2.81.3 db reset --local

      - name: Run database tests
        if: steps.local.outputs.enabled == 'true'
        run: npx --yes supabase@2.81.3 test db

      - name: Run database linter
        if: steps.local.outputs.enabled == 'true'
        run: npx --yes supabase@2.81.3 db lint --local --level warning

      - name: Stop local Supabase
        if: ${{ always() && steps.local.outputs.enabled == 'true' }}
        run: npx --yes supabase@2.81.3 stop --no-backup
