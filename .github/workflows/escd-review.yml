name: ESCD Review Gate

on:
  push:
    branches:
      - feature/escd-runtime-repair-001
  pull_request:
    paths:
      - 'apps/escd/**'
      - '03_WORK_ORDERS/ESCD/**'
      - 'supabase/migrations/20260909_escd_runtime_state.sql'
      - 'supabase/migrations/20260910_escd_runtime_integrity_patch.sql'
      - 'supabase/migrations/20260910_escd_exit_verification.sql'
      - 'supabase/migrations/20260910_escd_exec_pa_state.sql'
      - 'supabase/migrations/20260910_escd_exec_pa_transition_alignment.sql'
      - '.github/workflows/escd-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Compile ESCD Python
        run: python -m compileall -q apps/escd

      - name: Run ESCD policy and runtime tests
        run: python -m pytest -q apps/escd/tests

      - name: Bootstrap isolated Supabase-compatible SQL foundation
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE anon NOLOGIN;
          CREATE SCHEMA auth;
          CREATE SCHEMA dcse_cp;
          CREATE OR REPLACE FUNCTION auth.uid()
          RETURNS uuid
          LANGUAGE sql
          STABLE
          AS $$
            SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid
          $$;
          GRANT USAGE ON SCHEMA auth TO authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO authenticated;
          CREATE TABLE dcse_cp.operator_accounts (
            user_id uuid PRIMARY KEY,
            email text,
            active boolean NOT NULL DEFAULT true,
            access_scope text NOT NULL DEFAULT 'dcse_owner'
          );
          CREATE OR REPLACE FUNCTION dcse_cp.is_dcs_owner()
          RETURNS boolean
          LANGUAGE sql
          STABLE
          AS $$ SELECT true $$;
          SQL

      - name: Apply ESCD candidate migrations in isolated PostgreSQL
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260909_escd_runtime_state.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260910_escd_runtime_integrity_patch.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260910_escd_exit_verification.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260910_escd_exec_pa_state.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20260910_escd_exec_pa_transition_alignment.sql

      - name: Run ESCD SQL behavior checks
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f apps/escd/tests/sql/test_runtime_migrations.sql
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f apps/escd/tests/sql/test_exec_pa_migration.sql
