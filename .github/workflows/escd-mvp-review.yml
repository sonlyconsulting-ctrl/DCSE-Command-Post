name: ESCD Mainline Review Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/escd/**'
      - 'api/mvp.py'
      - 'tests/escd-provider-settings.test.js'
      - 'supabase/migrations/20260910_escd_mvp_items.sql'
      - 'vercel.json'
      - '.github/workflows/escd-mvp-review.yml'

permissions:
  contents: read

jobs:
  mvp-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile ESCD Python
        run: python -m py_compile api/mvp.py apps/escd/api/mvp.py apps/escd/runtime/auth.py apps/escd/runtime/repository.py apps/escd/runtime/mvp_data.py
      - name: Run ESCD MVP contract tests
        run: python -m pytest -q apps/escd/tests
      - name: Run provider settings browser-script tests
        run: node --test tests/escd-provider-settings.test.js
      - name: Verify persistence candidate is bounded
        run: |
          grep -F 'CREATE TABLE IF NOT EXISTS dcse_cp.escd_items' supabase/migrations/20260910_escd_mvp_items.sql
          grep -F 'CREATE POLICY escd_items_dcs_owner' supabase/migrations/20260910_escd_mvp_items.sql
          grep -F 'CANDIDATE ONLY' supabase/migrations/20260910_escd_mvp_items.sql
      - name: Verify no provider secrets in browser surface
        run: |
          ! grep -R -E 'OPENAI_API_KEY|GEMINI_API_KEY|GOOGLE_API_KEY|ANTHROPIC_API_KEY|DDNA_SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY' apps/escd/web
      - name: Verify no static DDNA 73 count
        run: '! grep -R -F "73 Queued" apps/escd/web'
