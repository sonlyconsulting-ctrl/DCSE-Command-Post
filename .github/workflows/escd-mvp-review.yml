name: ESCD Mainline Review Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/escd/**'
      - 'api/mvp.py'
      - 'tests/escd-provider-settings.test.js'
      - 'tests/escd-phase1-e2e.spec.js'
      - 'scripts/validate_escd_production_config.py'
      - 'supabase/candidates/20260910_escd_mvp_items.sql'
      - 'vercel.json'
      - '.github/workflows/escd-mvp-review.yml'

permissions:
  contents: read

jobs:
  mvp-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: |
          python -m pip install pytest
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Compile ESCD Python and validate deployment config syntax
        run: |
          python -m py_compile api/mvp.py apps/escd/api/mvp.py apps/escd/runtime/auth.py apps/escd/runtime/repository.py apps/escd/runtime/mvp_data.py scripts/validate_escd_production_config.py
          python -m json.tool vercel.json >/dev/null
          node --check apps/escd/web/attachments-v2.js
      - name: Run ESCD MVP contract tests
        run: python -m pytest -q apps/escd/tests
      - name: Run provider settings browser-script tests
        run: node --test tests/escd-provider-settings.test.js
      - name: Run Playwright desktop and mobile acceptance checks
        run: |
          python -m http.server 4173 --directory apps/escd/web >/tmp/escd-http.log 2>&1 &
          npx playwright test tests/escd-phase1-e2e.spec.js --reporter=line
      - name: Verify production validator is strict and has no local fallback
        run: |
          ! grep -F 'C:\\DS All Things' scripts/validate_escd_production_config.py
          ! grep -F 'load_env_if_local' scripts/validate_escd_production_config.py
          grep -F 'DDNA_SUPABASE_URL' scripts/validate_escd_production_config.py
          grep -F 'DDNA_SUPABASE_SERVICE_ROLE_KEY' scripts/validate_escd_production_config.py
      - name: Verify persistence candidate is bounded and non-deploying
        run: |
          test ! -e supabase/migrations/20260910_escd_mvp_items.sql
          grep -F 'CREATE TABLE IF NOT EXISTS dcse_cp.escd_items' supabase/candidates/20260910_escd_mvp_items.sql
          grep -F 'CREATE POLICY escd_items_dcs_owner' supabase/candidates/20260910_escd_mvp_items.sql
          grep -F 'CANDIDATE ONLY' supabase/candidates/20260910_escd_mvp_items.sql
          grep -F 'Do not apply to production without explicit DCS authorization.' supabase/candidates/20260910_escd_mvp_items.sql
      - name: Verify no provider secrets in browser surface
        run: |
          ! grep -R -E 'OPENAI_API_KEY|GEMINI_API_KEY|GOOGLE_API_KEY|ANTHROPIC_API_KEY|DDNA_SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE_KEY' apps/escd/web
      - name: Verify no static DDNA 73 count
        run: '! grep -R -F "73 Queued" apps/escd/web'
