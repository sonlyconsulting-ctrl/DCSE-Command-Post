name: V7.2 governance validation

on:
  pull_request:
    paths:
      - 'governance/v7.2/**'
      - 'governance/v7.2/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md'
      - 'governance/v7.2/doctrines/D21_Doctrine_Runtime_Engine_v7-2.md'
      - 'tribunal/v7/**'
      - 'DCSE_MANIFEST.yaml'
      - '.github/workflows/v7-2-governance-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'governance/v7.2/**'
      - 'governance/v7.2/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md'
      - 'governance/v7.2/doctrines/D21_Doctrine_Runtime_Engine_v7-2.md'
      - 'tribunal/v7/**'
      - 'DCSE_MANIFEST.yaml'
      - '.github/workflows/v7-2-governance-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate V7.2 authority, routing, and safety
        shell: python
        run: |
          import json
          import hashlib
          from pathlib import Path

          errors = []

          required = [
              Path('governance/v7.2/00_START_HERE.md'),
              Path('governance/v7.2/V7_2_CANONICAL_GOVERNANCE_PACKAGE_MANIFEST.json'),
              Path('governance/v7.2/DCSE_V7_2_R5_OPERATIVE_DESIGNATION_20260808.md'),
              Path('governance/v7.2/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md'),
              Path('governance/v7.2/DCSE_Master_Profile_Authority_Synchronization_v7-2.md'),
              Path('governance/v7.2/registry/DCSE_Doctrine_Index_v7-2.md'),
              Path('governance/v7.2/dcs_express_directives.v7.2.json'),
              Path('governance/v7.2/doctrines/D01_Forward_Thinking_v7-2.md'),
              Path('governance/v7.2/doctrines/D02_Forward_Backward_Chaining_v7-2.md'),
              Path('governance/v7.2/doctrines/D03_AI_Orchestration_v7-2.md'),
              Path('governance/v7.2/doctrines/D04_Command_Post_Communications_v7-2.md'),
              Path('governance/v7.2/doctrines/D05_Baseline_Promotion_v7-2.md'),
              Path('governance/v7.2/doctrines/D06_File_System_v7-2.md'),
              Path('governance/v7.2/doctrines/D07_Campaign_Governance_v7-2.md'),
              Path('governance/v7.2/doctrines/D08_Voice_Tone_v7-2.md'),
              Path('governance/v7.2/doctrines/D09_Brand_Identity_v7-2.md'),
              Path('governance/v7.2/doctrines/D10_Persona_Assets_v7-2.md'),
              Path('governance/v7.2/doctrines/D11_HTML_Wix_App_v7-2.md'),
              Path('governance/v7.2/doctrines/D12_Video_Media_v7-2.md'),
              Path('governance/v7.2/doctrines/D13_DART_Core_v7-2.md'),
              Path('governance/v7.2/doctrines/D14_DART_PS_Protected_v7-2.md'),
              Path('governance/v7.2/doctrines/D15_Database_Administration_v7-2.md'),
              Path('governance/v7.2/doctrines/D16_DDNA_Governance_v7-2.md'),
              Path('governance/v7.2/doctrines/D17_DART_Universal_Methodology_v7-2.md'),
              Path('governance/v7.2/doctrines/D18_Media_Production_Pipeline_v7-2.md'),
              Path('governance/v7.2/doctrines/D19_Visual_Creation_Pipeline_v7-2.md'),
              Path('governance/v7.2/doctrines/D20_Product_Assembly_Methodology_v7-2.md'),
              Path('governance/v7.2/doctrines/D21_Doctrine_Runtime_Engine_v7-2.md'),
              Path('governance/v7.2/doctrines/D22_Source_Authority_Runtime_Distribution_v7-2.md'),
              Path('governance/v7.2/DCSE_Runtime_Harmony_Task_Traceability_and_Navigable_Closeout_v7-2.md'),
              Path('governance/v7.2/UNIVERSAL_AGENT_ONBOARDING_AND_ACCESS_STANDARD_v7-2.md'),
              Path('governance/v7.2/DCS_LEVEL_0_RESERVED_STOP_GATES_v7-2.md'),
              Path('governance/v7.2/ZONE_INDEX.v7.2.json'),
              Path('governance/v7.2/project-instructions/DCSE_COMMAND_POST_PROJECT_INSTRUCTIONS_v7_2_FINAL.md'),
              Path('governance/v7.2/rule-foundry/DCSE_V7_2_RULE_GENERATION_AND_EXECUTABLE_BASELINE_STANDARD.md'),
              Path('governance/v7.2/rule-foundry/DCSE_RULE_SCHEMA_v1.json'),
              Path('governance/v7.2/rule-foundry/DCSE_DDNA_RULE_EXTRACTION_PROFILE_v1.md'),
              Path('governance/v7.2/rule-foundry/DCSE_CONTENT_AND_ARTIFACT_GENERATION_STANDARD_v1.md'),
              Path('governance/v7.2/rule-foundry/DCSE_CONTENT_ARTIFACT_RULESET_v1.json'),
              Path('governance/v7.2/architecture/DCSE_CREATIVE_INTELLIGENCE_COMMERCE_ROUTER_v1.md'),
              Path('governance/v7.2/DCSE_V7_2_BOUNDED_INDEPENDENT_AUTHORITY_RULE_FOUNDRY_DIRECTION_20260911.md'),
              Path('DCSE_MANIFEST.yaml'),
          ]

          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              errors.append('Missing required V7.2 authority/routing files: ' + ', '.join(missing))

          package_manifest = Path('governance/v7.2/V7_2_CANONICAL_GOVERNANCE_PACKAGE_MANIFEST.json')
          if package_manifest.is_file():
              try:
                  pkg = json.loads(package_manifest.read_text(encoding='utf-8'))
                  ids = [d.get('id') for d in pkg.get('doctrine_set', []) if isinstance(d, dict)]
                  expected_ids = [f'D{i:02d}' for i in range(1, 23)]
                  if ids != expected_ids:
                      errors.append('V7.2 canonical package manifest must contain exactly D01-D22 in order.')
                  if pkg.get('front_door') != 'governance/v7.2/00_START_HERE.md':
                      errors.append('V7.2 canonical package manifest front door is incorrect.')
              except Exception as exc:
                  errors.append(f'V7.2 canonical package manifest invalid JSON: {exc}')

          def read(path):
              return path.read_text(encoding='utf-8', errors='replace')

          # Temporary compatibility mirrors must remain byte-identical to canonical operational paths.
          mirror_pairs = [
              (Path('governance/v7.2/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md'), Path('governance/v7.2/source/doctrines/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md')),
              (Path('governance/v7.2/registry/DCSE_Doctrine_Index_v7-2.md'), Path('governance/v7.2/source/registry/DCSE_Doctrine_Index_v7-2.md')),
          ]
          for canonical_path in Path('governance/v7.2/doctrines').glob('D*_v7-2.md'):
              mirror_pairs.append((canonical_path, Path('governance/v7.2/source/doctrines') / canonical_path.name))

          for canonical_path, mirror_path in mirror_pairs:
              if not canonical_path.is_file():
                  errors.append(f'Canonical v7.2 path missing: {canonical_path}')
              elif not mirror_path.is_file():
                  errors.append(f'Compatibility mirror missing: {mirror_path}')
              elif canonical_path.read_bytes() != mirror_path.read_bytes():
                  errors.append(f'Compatibility mirror drift: {canonical_path} != {mirror_path}')

          for json_path in [
              Path('governance/v7.2/rule-foundry/DCSE_RULE_SCHEMA_v1.json'),
              Path('governance/v7.2/rule-foundry/DCSE_CONTENT_ARTIFACT_RULESET_v1.json'),
          ]:
              if json_path.is_file():
                  try:
                      json.loads(read(json_path))
                  except Exception as exc:
                      errors.append(f'Rule Foundry JSON invalid: {json_path}: {exc}')

          project_instructions = Path('governance/v7.2/project-instructions/DCSE_COMMAND_POST_PROJECT_INSTRUCTIONS_v7_2_FINAL.md')
          if project_instructions.is_file():
              project_text = read(project_instructions)
              marker = 'DCSE COMMAND POST PROJECT INSTRUCTIONS\n'
              if marker not in project_text:
                  errors.append('Project Settings payload marker missing.')
              else:
                  payload = project_text.split(marker, 1)[1].rstrip('\n')
                  if len(payload) > 8000:
                      errors.append(f'Project Settings payload exceeds 8000 characters: {len(payload)}')
                  declared = '**Project Settings Payload Character Count:** ' + str(len(payload))
                  if declared not in project_text:
                      errors.append('Project Settings payload character-count metadata does not match actual payload.')
                  payload_sha = hashlib.sha256(payload.encode('utf-8')).hexdigest()
                  declared_sha = '**Project Settings Payload SHA-256:** ' + payload_sha
                  if declared_sha not in project_text:
                      errors.append('Project Settings payload SHA-256 metadata does not match actual payload.')

          designation = Path('governance/v7.2/DCSE_V7_2_R5_OPERATIVE_DESIGNATION_20260808.md')
          master = Path('governance/v7.2/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md')
          directive_registry = Path('governance/v7.2/dcs_express_directives.v7.2.json')
          d20 = Path('governance/v7.2/doctrines/D20_Product_Assembly_Methodology_v7-2.md')
          d22 = Path('governance/v7.2/doctrines/D22_Source_Authority_Runtime_Distribution_v7-2.md')
          traceability = Path('governance/v7.2/DCSE_Runtime_Harmony_Task_Traceability_and_Navigable_Closeout_v7-2.md')
          manifest = Path('DCSE_MANIFEST.yaml')

          if designation.is_file():
              text = read(designation)
              for token in ['Status: OPERATIVE AUTHORITY DESIGNATION', 'Authority: DCS', 'DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md']:
                  if token not in text:
                      errors.append(f'Operative designation missing required token: {token}')

          if master.is_file():
              text = read(master)
              if 'DCSE MASTER PROFILE v7.2' not in text:
                  errors.append('Master Profile is not identified as v7.2.')

          if d20.is_file():
              text = read(d20)
              for token in ['**Version:** v7.2', '**Status:** ACTIVE / OPERATIVE', '**Promotion Status:** PROMOTED', 'Reuse Before Redesign']:
                  if token not in text:
                      errors.append(f'D20 v7.2 missing required token: {token}')

          if d22.is_file():
              text = read(d22)
              for token in ['GitHub', 'Supabase', 'Tribunal', 'Vault']:
                  if token not in text:
                      errors.append(f'D22 v7.2 missing persistence-routing token: {token}')

          if traceability.is_file():
              text = read(traceability)
              for token in [
                  'Mandatory Task Traceability and Intake Declaration',
                  'Mandatory Navigable Final Reporting and Closeout',
                  'ESCD Next-Work Prioritization and DCS Interruption Control',
                  'CONTINUE | SKIP | DEFER | REORDER | INTERRUPT',
              ]:
                  if token not in text:
                      errors.append(f'Traceability/closeout directive missing required token: {token}')

          if directive_registry.is_file():
              try:
                  registry = json.loads(read(directive_registry))
              except Exception as exc:
                  errors.append(f'dcs_express_directives.v7.2.json invalid JSON: {exc}')
                  registry = {}
              ids = {d.get('directive_id') for d in registry.get('directives', []) if isinstance(d, dict)}
              if 'DCS-DIR-20260910-001' not in ids:
                  errors.append('Express directive registry missing DCS-DIR-20260910-001.')
              if 'DCS-DIR-20260911-001' not in ids:
                  errors.append('Express directive registry missing DCS-DIR-20260911-001.')

          old_traceability = Path('governance/v7.2/DCSE_V7_2_RUNTIME_HARMONY_AND_PS_PUBLICATION_DIRECTIVE_20260905.md')
          if old_traceability.exists():
              errors.append('Superseded runtime-harmony canonical file still exists alongside v7-2 replacement.')

          if manifest.is_file():
              manifest_text = read(manifest)
              required_manifest_values = [
                  'front_door: "governance/v7.2/00_START_HERE.md"',
                  'doctrine_root: "governance/v7.2/doctrines/"',
                  'complete_package_manifest: "governance/v7.2/V7_2_CANONICAL_GOVERNANCE_PACKAGE_MANIFEST.json"',
                  'constitutional_entrypoint: "governance/v7.2/DCSE_MASTER_PROFILE_v7_2_R5_FINAL.md"',
                  'source_authority_and_reconciliation: "governance/v7.2/doctrines/D22_Source_Authority_Runtime_Distribution_v7-2.md"',
                  'task_traceability_and_navigable_closeout: "governance/v7.2/DCSE_Runtime_Harmony_Task_Traceability_and_Navigable_Closeout_v7-2.md"',
                  'current_package_state: "OPERATIVE_R5_PLUS_PROMOTED_V7_2_GOVERNANCE_SYNC_AND_NAVIGABLE_CLOSEOUT"',
              ]
              for value in required_manifest_values:
                  if value not in manifest_text:
                      errors.append(f'DCSE_MANIFEST.yaml missing required v7.2 routing value: {value}')

          prohibited_credentials = [
              'SUPABASE_SERVICE_ROLE_KEY=',
              'GITHUB_TOKEN=',
              'GH_TOKEN=',
              'DATABASE_PASSWORD=',
              'JWT_SECRET=',
          ]
          for root in [Path('governance/v7.2'), Path('tribunal/v7')]:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in {'.md', '.json', '.yaml', '.yml', '.txt', '.py', '.ps1'}:
                      continue
                  text = read(path)
                  for token in prohibited_credentials:
                      if token in text:
                          errors.append(f'{path}: contains prohibited credential assignment {token}')

          if errors:
              raise SystemExit('\n'.join(f'ERROR: {error}' for error in errors))

          print('V7.2 authority, routing, traceability, and safety validation passed.')
